<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多媒體相關</title>
    <link rel="stylesheet" href="/reset.css">
    
  </head>
  <body>
    <main>
      <canvas id="abc" width="300" height="150"></canvas>
      <script>
      const ctx = document.getElementById('abc').getContext('2d');
      ctx.fillStyle = 'blue';
      ctx.fillRect(0, 20, 100, 80);
      </script>
      <svg width="200" height="200">
        <rect width="100" height="150" fill="#FFAAAA">
      </svg>
      <br>
      <svg width="200" height="200">
        <circle cx="60" cy="60" r="60" fill="green">
      </svg>
      <br>
      <svg width="300" height="200">
        <line x1="20" y1="20" x2="100" y2="100" stroke="tomato" stroke-width="5">
      </svg>


      <br>
      <audio controls>
        <source src="music.mp3" type="audio/mpeg" />
        您的瀏覽器不支援這個音訊檔。
      </audio>

      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/XqZsoesa55w?si=xttZXZG3lUBkfDG2"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7230.049831677038!2d121.56137209169432!3d25.033228495856907!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442abe10238cb87%3A0x8c0ca929f18c0d23!2z5Y-w5YyXMTAx!5e0!3m2!1szh-TW!2stw!4v1790214388455!5m2!1szh-TW!2stw"
        width="600"
        height="450"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </main>
  </body>
</html>
