<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/reset.css">
</head>
<body>
  <main>

    <canvas id="myCanvas" width="300" height="150"></canvas>
    <script>
      const ctx = document.getElementById('myCanvas').getContext('2d');
      ctx.fillStyle = 'tomato';
      ctx.fillRect(20, 20, 100, 80);
    </script>

    <br>
    
    <svg width="200" height="200">
      <rect width="100" height="150" fill="#FFAAAA">
    </svg>
    <br>
    <svg width="200" height="200">
      <circle cx="60" cy="60" r="50" fill="green"></circle>
    </svg>
    <br>
    <svg width="300" height="200">
      <line x1="20" y1="20" x2="100" y2="100" stroke="tomato" stroke-width="5">
    </svg>

    <br>

    <audio controls>
      <source src="music.mp3" type="audio/mpeg" />
    </audio>
  </main>
  <iframe width="560" height="315" src="https://www.youtube.com/embed/ISI7L1qwfw4?si=Axvp5nQdJcXOcw8C" title="YouTube video player" frameborder="0" 
  allow="
  accelerometer; 
  autoplay; 
  clipboard-write; 
  encrypted-media; 
  gyroscope; 
  picture-in-picture; 
  web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d14462.462472273088!2d121.54913138175048!3d25.013173945607303!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442ab47dcf2b13d%3A0xf721ed46632faef7!2z5paH5bGx5qOu5p6X5YWs5ZyS!5e0!3m2!1szh-TW!2stw!4v1790214577541!5m2!1szh-TW!2stw" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>  
</body>
</html>
