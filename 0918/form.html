<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/reset.css">
  <link rel="stylesheet" href="form.css">
</head>
<body>
  <form action="">
    <!-- 方法一：label包住input -->
    <!-- <label>
      姓名：
    <input type="text">
    </label> -->
    <!-- 方法二：label for等於input id -->
    <!-- <label for="name">姓名：</label>
    <input type="text" id="name" /> -->
    <!-- 錯誤方法 -->
    <!-- <span>姓名：</span>
    <input type="text" name="" id="">
    <input type="submit" value="呵呵"> -->

  
    <input type="hidden" id="token" name="token" value="123">

    <label for="name">姓名：</label>
    <input type="text" id="name" name="name" required />

    <label for="password">密碼：</label>
    <input type="password" id="password" disabled>

    <label for="email">信箱</label>
    <input type="email" id="email" name="email" value="123@gmail.com" multiple>

    <label for="lucky-number">幸運號碼</label>
    <input type="number" id="lucky-number" name="number" min="3" max="10">

    <label for="tel">電話號碼</label>
    <input type="tel" id="tel" name="tel" placeholder="0912345678" pattern="[0-9]{6}">

    <label for="search">搜尋</label>
    <input type="search"  id="search" name="search" maxlength="2">

    <label for="address">地址：</label>
    <input type="text" id="address" name="address" />

    <label for="hooby">興趣：</label>
    <input type="text" id="hooby" name="hooby" />
    <!-- 提交按鈕 -->
     <input type="submit" value="呵呵" class="submit-btn" />
     <input type="reset" value="全部清空">
     <input type="button" value="單純的按鈕">    
  </form>
</body>
</html>
