<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Menu</title>
    <!-- <link href="test.css" rel="stylesheet" /> -->

    <script type="module" src="./test.js"></script>
  </head>
  <body>
    <div x-data="{ hasToken: false }">
      <button x-show="!hasToken">登入</button>
      <button x-show="hasToken">登出</button>
    </div>


    <div x-data="auth">
      <button @click="gotoLogin()">登入</button>
      <button @click="gotoSignUp()">註冊</button>

      <h1 x-show="page === 'login'">登入畫面</h1>
      <h1 x-show="page === 'signup'">註冊畫面</h1>
    </div>
  </body>
</html>
