<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/reset.css">
  <link rel="stylesheet" href="transform.css">
</head>
<body>
  <section class="translate">
    <div>原本位置</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
  </section>
  <section class="scale">
    <div>原本大小</div>
    <div>放大1.5倍</div>
    <div>Y軸放大1.50</div>
    <div>X 1.5 Y 1.5</div>
  </section>
  <section class="rotate">
    <div>原本</div>
    <div>轉45度</div>
    <div>X轉半圈</div>
    <div>Y轉180度</div>
  </section>
  <section class="skew">
    <div>原本</div>
    <div>X 45deg</div>
    <div>原本</div>
    <div>Y 45deg</div>
  </section>
  <section class="mix">
    <div></div>
    <div>2</div>
    <div>3</div>
  </section>
  <section class="origin">
    <div></div>
    <div>2</div>
    <div>3</div>
    <div></div>
  </section>
  <section class="perpective">
    <div>原始</div>
    <div>沒有perpective</div>
    <div>有perpective</div>
    <div>translateZ</div>
  </section>
  <section class="look">
    <div class="cube">
      <div class="front">前</div>
      <div class="back">後</div>
      <div class="top">上</div>
      <div class="bottom">下</div>
      <div class="left">左</div>
      <div class="right">右</div>
    </div>
  </section>
  <section class="duration">
    <div>0.5s</div>
    <div>1</div>
    <div>2</div>
    <div>3s</div>
  </section>
  <section class="property">
    <div>沒有</div>
    <div>transform</div>
    <div>bg-color</div>
    <div>all</div>
  </section>
</body>
</html>
